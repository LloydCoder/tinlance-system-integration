name: Production System-of-Systems Certification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  final:
    name: TSIC-38 final forensic certification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run final forensic certification
        run: python scripts/final_certification.py
