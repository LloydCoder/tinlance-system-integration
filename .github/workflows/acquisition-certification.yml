name: Acquisition System Certification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  acquisition:
    name: TSIC-25 Acquisition System certification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Certify reviewed acquisition sequence
        run: python scripts/certify_acquisition_system.py
