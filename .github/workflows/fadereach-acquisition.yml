name: TSIC-04 FadeReach Acquisition E2E
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tsic-04-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fadereach-acquisition:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15-alpine3.24
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_DB: fadereach_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d fadereach_test"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7.4.11-alpine3.21
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - name: Checkout TSIC
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: tsic, persist-credentials: false}
      - name: Checkout reviewed FadeReach revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: LloydCoder/fadereach
          ref: ecd66b86840cdf08a65d0f2485564d5beed452bb
          path: fadereach
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12', cache: pip, cache-dependency-path: fadereach/backend/requirements.txt}
      - name: Install FadeReach dependencies
        working-directory: fadereach/backend
        run: python -m pip install -r requirements.txt
      - name: Certify TSIC-04 canonical baseline
        working-directory: tsic
        run: python scripts/certify_fadereach_acquisition.py
      - name: Validate source-owned TSIC conformance
        working-directory: fadereach
        run: python scripts/tsic_conformance.py
      - name: Compile FadeReach backend
        working-directory: fadereach/backend
        run: python -m compileall -q .
      - name: Provision restricted database roles
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d fadereach_test -v ON_ERROR_STOP=1 -c "CREATE ROLE fadereach_runtime LOGIN PASSWORD 'runtime-password'; CREATE ROLE fadereach_worker LOGIN BYPASSRLS PASSWORD 'worker-password';"
      - name: Apply reviewed database migrations
        working-directory: fadereach
        env:
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fadereach_test
          DATABASE_URL: postgresql://fadereach_runtime:runtime-password@localhost:5432/fadereach_test
        run: alembic upgrade head
      - name: Run acquisition, webhook, idempotency, consent and security tests
        working-directory: fadereach/backend
        env:
          ENVIRONMENT: test
          JWT_SECRET: ci-test-secret-at-least-32-characters-long
          DATABASE_URL: postgresql://fadereach_runtime:runtime-password@localhost:5432/fadereach_test
          REDIS_URL: redis://localhost:6379/0
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fadereach_test
          SIGNAL_INGEST_SECRET: ci-signal-secret-012345678901234567890123456789
        run: python -m pytest -q tests/test_tads_sdea_bridge.py tests/test_outbound_queue.py tests/test_deliverability_contract.py tests/test_enterprise_security_contract.py tests/test_data_governance_contract.py tests/test_phase_16_durable_execution.py tests/test_phase_17_deliverability.py tests/test_phase_23_governance.py
      - name: Run full reviewed FadeReach backend suite
        working-directory: fadereach/backend
        env:
          ENVIRONMENT: test
          JWT_SECRET: ci-test-secret-at-least-32-characters-long
          DATABASE_URL: postgresql://fadereach_runtime:runtime-password@localhost:5432/fadereach_test
          REDIS_URL: redis://localhost:6379/0
          MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fadereach_test
          SIGNAL_INGEST_SECRET: ci-signal-secret-012345678901234567890123456789
        run: python -m pytest -q tests
      - name: Post-phase forensic audit
        working-directory: tsic
        run: python scripts/forensic_audit_phase4.py
