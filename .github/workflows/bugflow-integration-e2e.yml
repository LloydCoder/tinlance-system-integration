name: TSIC-11 BugFlow Integration E2E
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tsic-11-bugflow-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bugflow-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout TSIC
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b
        with:
          path: tsic
          persist-credentials: false
      - name: Checkout reviewed BugFlow
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b
        with:
          repository: LloydCoder/bugflow-elite
          ref: c9ef8b5f7ef87aaaf23b943a498f39ce8697d07b
          path: bugflow
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bugflow/requirements.txt
      - name: Install deterministic test dependencies
        working-directory: bugflow
        run: |
          python -m pip install --upgrade pip
          python -m pip install aiohttp pyyaml python-dotenv APScheduler pytz requests httpx dnspython mmh3 psutil pytest pytest-asyncio pytest-cov respx
      - name: Compile BugFlow Python sources
        working-directory: bugflow
        run: python -m compileall -q .
      - name: Run BugFlow test suite
        working-directory: bugflow
        env:
          PYTHONPATH: .
        run: |
          mkdir -p output db config/scope custom-templates
          touch output/.gitkeep custom-templates/.gitkeep
          python -m pytest tests/ -q --tb=short --no-header --cov=modules --cov=config --cov=db --cov-report=term-missing --cov-fail-under=20
      - name: Verify TSIC BugFlow authority and contract
        working-directory: tsic
        run: python3 scripts/certify_bugflow.py
      - name: Post-phase forensic audit
        working-directory: tsic
        run: python3 scripts/forensic_audit_phase11.py
