name: Agent System Contract and Finite-Phase Conformance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: agent-system-certification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify:
    name: Agent System contract and finite-phase conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout TSIC
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"

      - name: Checkout canonical TADL lock source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: LloydCoder/tinlance-agent-developer
          ref: 1e6f11f0d6e4a396028c6a3475425410be2cdd71
          path: agent-developer-lock
          persist-credentials: false

      - name: Read immutable Agent System baseline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          baseline = json.loads(Path("policies/agent-system-baseline.json").read_text())
          lock = json.loads(Path("agent-developer-lock/ecosystem.lock.json").read_text())
          if lock.get("schema") != "tinlance-agent-ecosystem-lock/v1":
              raise SystemExit("canonical TADL lock schema is invalid")
          if baseline["baseline_id"] != lock["baseline_id"]:
              raise SystemExit("TSIC baseline ID differs from canonical TADL lock")
          authority = lock["integration_authority"]
          if baseline["tsic"] != {"repository": authority["repository"], "ref": authority["ref"]}:
              raise SystemExit("TSIC authority pin differs from canonical TADL lock")
          if set(baseline["repositories"]) != set(lock["repositories"]):
              raise SystemExit("TSIC and TADL repository sets differ")
          for key, item in baseline["repositories"].items():
              locked = lock["repositories"][key]
              if item["repository"] != locked["repository"] or item["ref"] != locked["ref"]:
                  raise SystemExit(f"TSIC baseline differs from canonical TADL lock for {key}")
              if len(item["ref"]) != 40 or any(ch not in "0123456789abcdef" for ch in item["ref"]):
                  raise SystemExit(f"invalid immutable reviewed SHA for {key}")
          print(f"Agent System canonical baseline: {baseline['baseline_id']} (TADL P10 release lock)")
          PY

      - name: Materialize reviewed Agent System repositories
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          lock = json.loads(Path("agent-developer-lock/ecosystem.lock.json").read_text())
          for name, item in lock["repositories"].items():
              target = Path("/tmp") / f"tinlance-{name}"
              subprocess.run(
                  ["git", "clone", "--quiet", f"https://github.com/{item['repository']}.git", str(target)],
                  check=True,
              )
              subprocess.run(
                  ["git", "-C", str(target), "checkout", "--quiet", item["ref"]],
                  check=True,
              )
              actual = subprocess.check_output(["git", "-C", str(target), "rev-parse", "HEAD"], text=True).strip()
              if actual != item["ref"]:
                  raise SystemExit(f"reviewed checkout mismatch for {name}: {actual} != {item['ref']}")
          authority = lock["integration_authority"]
          tsic_target = Path("/tmp/tinlance-tsic")
          subprocess.run(
              ["git", "clone", "--quiet", f"https://github.com/{authority['repository']}.git", str(tsic_target)],
              check=True,
          )
          subprocess.run(
              ["git", "-C", str(tsic_target), "checkout", "--quiet", authority["ref"]],
              check=True,
          )
          actual_tsic = subprocess.check_output(["git", "-C", str(tsic_target), "rev-parse", "HEAD"], text=True).strip()
          if actual_tsic != authority["ref"]:
              raise SystemExit(f"reviewed TSIC checkout mismatch: {actual_tsic} != {authority['ref']}")
          PY

      - name: Install TADL
        working-directory: agent-developer-lock
        run: npm ci --ignore-scripts && npm run build

      - name: Install Python integration components
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=8.4"
          python -m pip install /tmp/tinlance-platform /tmp/tinlance-platform_sdk /tmp/tinlance-os
          python -m pip install -e "/tmp/tinlance-platform/reference_agents[test]" --no-deps

      - name: Verify canonical TSIC authority against reviewed baseline
        working-directory: agent-developer-lock
        run: python scripts/tsic_conformance.py

      - name: Run Agent System end-to-end contract certification
        working-directory: agent-developer-lock
        run: python scripts/ecosystem_conformance.py

      - name: Run finite-phase certification
        working-directory: agent-developer-lock
        run: python scripts/ecosystem_phase_conformance.py
