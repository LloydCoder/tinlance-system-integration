name: Acquisition System Certification
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: acquisition-system-certification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  certify:
    name: Acquisition System end-to-end contract certification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout TSIC
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Materialize reviewed acquisition repositories
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          b=json.loads(Path("policies/acquisition-system-baseline.json").read_text())
          assert len(b["tsic"]["ref"]) == 40
          for name,item in b["systems"].items():
              assert len(item["ref"]) == 40, name
              target=Path("/tmp")/f"tinlance-{name.replace('_','-')}"
              subprocess.run(["git","clone","--quiet",f"https://github.com/{item['repository']}.git",str(target)],check=True)
              subprocess.run(["git","-C",str(target),"checkout","--quiet",item["ref"]],check=True)
          PY
      - name: Verify World Intelligence
        working-directory: /tmp/tinlance-world-intelligence
        run: python scripts/tsic_conformance.py
      - name: Verify TADS
        working-directory: /tmp/tinlance-tads
        run: python scripts/tsic_conformance.py
      - name: Verify SDEA
        working-directory: /tmp/tinlance-sdea
        run: python scripts/tsic_conformance.py
      - name: Verify ReconOS
        working-directory: /tmp/tinlance-reconos
        run: python scripts/tsic_conformance.py
      - name: Verify FadeReach
        working-directory: /tmp/tinlance-fadereach
        run: python scripts/tsic_conformance.py
      - name: Validate authority invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          b=json.loads(Path("policies/acquisition-system-baseline.json").read_text())
          expected={"signal_provenance_preserved","targeting_decisioning_remains_tads_authority","engineering_acquisition_remains_sdea_authority","osint_enrichment_remains_reconos_authority","outreach_execution_remains_fadereach_authority","tsic_remains_integration_authority","agent-platform-remains-execution-authority"}
          assert set(b["invariants"]) == expected
          assert b["sequence"] == ["world-intelligence","tads","sdea","reconos","fadereach"]
          print("PASS Acquisition System authority and sequence invariants")
          PY
