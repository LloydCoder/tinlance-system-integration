name: TSIC-09 ThreatFade Detection-to-Delivery E2E
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tsic-09-${{ github.ref }}
  cancel-in-progress: true
jobs:
  threatfade-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      PYTHONPATH: ${{ github.workspace }}/threatfade
      THREATFADE_ENV: development
      TEST_DATABASE_URL: postgresql+psycopg://threatfade:threatfade_ci@localhost:5432/threatfade_test
      TEST_DATABASE_ADMIN_URL: postgresql+psycopg://threatfade:threatfade_ci@localhost:5432/postgres
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_DB: postgres, POSTGRES_USER: threatfade, POSTGRES_PASSWORD: threatfade_ci}
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U threatfade -d postgres"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - name: Checkout TSIC
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: tsic, persist-credentials: false}
      - name: Checkout reviewed ThreatFade engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: LloydCoder/tinlance-threatfade, ref: 4691ead86fadd1c95767886d7fb15bacbed012fe, path: threatfade, persist-credentials: false}
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with: {python-version: '3.12'}
      - name: Install ThreatFade dependencies
        working-directory: threatfade
        run: python -m pip install -r requirements.txt
      - name: Compile engine and tests
        working-directory: threatfade
        run: python -m compileall -q core scripts tests benchmarks
      - name: Validate ThreatFade security and detection architecture
        working-directory: threatfade
        run: |
          python scripts/validate_security_architecture.py
          python scripts/validate_identity_architecture.py
          python scripts/validate_detection_science.py
          python scripts/validate_corpus_architecture.py
          python scripts/validate_supply_chain.py
          python scripts/validate_ground_truth.py
          python scripts/validate_reliability.py
      - name: Run analyst, detection, evidence and security tests
        working-directory: threatfade
        env:
          PYTHONPATH: ${{ github.workspace }}/threatfade
          THREATFADE_ENV: development
          TEST_DATABASE_URL: postgresql+psycopg://threatfade:threatfade_ci@localhost:5432/threatfade_test
          TEST_DATABASE_ADMIN_URL: postgresql+psycopg://threatfade:threatfade_ci@localhost:5432/postgres
        run: python -m pytest -q tests/test_analyst_api.py tests/test_analyst_workflow.py tests/test_detection_pipeline.py tests/test_enterprise_security.py tests/test_integrity.py tests/test_reliability.py tests/test_evaluation.py
      - name: Run complete ThreatFade test suite
        working-directory: threatfade
        env:
          PYTHONPATH: ${{ github.workspace }}/threatfade
          THREATFADE_ENV: development
          TEST_DATABASE_URL: postgresql+psycopg://threatfade:threatfade_ci@localhost:5432/threatfade_test
          TEST_DATABASE_ADMIN_URL: postgresql+psycopg://threatfade:threatfade_ci@localhost:5432/postgres
        run: python -m pytest -q
      - name: Run detection science and adversarial benchmarks
        working-directory: threatfade
        run: |
          python benchmarks/benchmark.py
          python benchmarks/detection_science_v2.py
          python benchmarks/adversarial.py
      - name: Validate TSIC ThreatFade authority contract
        working-directory: tsic
        run: python scripts/certify_threatfade.py
      - name: Post-phase forensic audit
        working-directory: tsic
        run: python scripts/forensic_audit_phase9.py
