name: TSIC-01 Agent System E2E
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tsic-01-${{ github.ref }}
  cancel-in-progress: true
jobs:
  agent-system-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/agent-platform
      TSIC_PLATFORM_TOKEN: token-tsic
      TSIC_PLATFORM_TENANT: tenant-tsic
      TSIC_PLATFORM_SUBJECT: subject-tsic
      TSIC_PLATFORM_APPROVER_TOKEN: approver-tsic-token
    steps:
      - name: Checkout TSIC
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {path: tsic, persist-credentials: false}
      - name: Checkout reviewed ecosystem lock source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: LloydCoder/tinlance-agent-developer, ref: 1e6f11f0d6e4a396028c6a3475425410be2cdd71, path: agent-developer-lock, persist-credentials: false}
      - name: Checkout Agent Developer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: LloydCoder/tinlance-agent-developer, ref: 74fb6f441b19966c07010d30fe94c99d3cca1a29, path: agent-developer, persist-credentials: false}
      - name: Checkout Agent OS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: LloydCoder/tinlance-agent-os, ref: 642d2c78810ff4eb6b9ec69e2fa1b4b5775b6b4f, path: agent-os, persist-credentials: false}
      - name: Checkout Platform SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: LloydCoder/tinlance-agent-platform-sdk, ref: 9d12512bc1446133890e62ed0c3072ca28e623b7, path: agent-platform-sdk, persist-credentials: false}
      - name: Checkout Agent Platform
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {repository: LloydCoder/tinlance-agent-platform, ref: c5a080c1fb4df68e45070f8cddfc30bf81edd7bb, path: agent-platform, persist-credentials: false}
      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with: {python-version: '3.12'}
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with: {node-version: '22', cache: npm, cache-dependency-path: agent-developer/package-lock.json}
      - name: Verify cross-repository revisions against TADL ecosystem lock
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          lock = json.loads(Path("agent-developer-lock/ecosystem.lock.json").read_text())
          repositories = {
              "developer": "agent-developer",
              "os": "agent-os",
              "platform": "agent-platform",
              "platform_sdk": "agent-platform-sdk",
          }
          errors = []
          for key, checkout in repositories.items():
              expected = lock["repositories"][key]["ref"]
              actual = subprocess.check_output(
                  ["git", "-C", checkout, "rev-parse", "HEAD"], text=True
              ).strip()
              if actual != expected:
                  errors.append(f"{key}: expected {expected}, got {actual}")
          if errors:
              raise SystemExit("Ecosystem lock mismatch:\\n" + "\\n".join(errors))
          print("PASS cross-repository SHAs match the reviewed TADL ecosystem lock")
          PY
      - name: Install Platform
        run: python -m pip install -e './agent-platform[test]'
      - name: Install Agent OS
        run: python -m pip install -e './agent-os'
      - name: Install Platform SDK
        run: python -m pip install -e './agent-platform-sdk'
      - name: Build Agent Developer
        working-directory: agent-developer
        run: npm ci --ignore-scripts && npm run build
      - name: Validate TADL fixture
        working-directory: agent-developer
        run: node cli/tadl.mjs agent validate ../tsic/fixtures/agent-system/reference-agent.json
      - name: Platform API and governance tests
        run: python -m pytest -q agent-platform/tests/api/test_agent_os_gateway.py agent-platform/tests/e2e/test_hello_governed_agent.py
      - name: Agent OS integration tests
        run: python -m pytest -q agent-os/tests/integration
      - name: Platform SDK contract tests
        working-directory: agent-platform-sdk
        run: python -m pytest -q tests/test_client.py tests/test_retry.py tests/test_compatibility_matrix.py
      - name: Start reference Platform
        working-directory: tsic
        run: python scripts/agent_system_platform_server.py > /tmp/tsic-platform-url & echo $! > /tmp/tsic-platform-pid
      - name: Wait for reference Platform
        run: for i in $(seq 1 30); do test -s /tmp/tsic-platform-url && break; sleep 1; done; test -s /tmp/tsic-platform-url
      - name: Export reference Platform endpoint
        run: echo "TSIC_PLATFORM_URL=$(cat /tmp/tsic-platform-url)" >> "$GITHUB_ENV"
      - name: Probe reference Platform authentication
        run: |
          curl --fail-with-body -sS -X POST "$(cat /tmp/tsic-platform-url)" \
            -H 'Authorization: Bearer tsic-reference-token' \
            -H 'Content-Type: application/json' \
            -H 'X-Tinlance-API-Version: 1.1' \
            -H 'X-Request-ID: tsic-health-probe' \
            --data '{"tenant_id":"tenant-tsic","subject_id":"subject-tsic","operation":"health","payload":{}}'
      - name: Execute cross-repository vertical slice
        working-directory: tsic
        run: |
          set +e
          python scripts/certify_agent_system_e2e.py 2>&1 | tee /tmp/tsic-agent-e2e.log
          rc=${PIPESTATUS[0]}
          echo "TSIC_AGENT_E2E_RC=${rc}"
          exit ${rc}
      - name: Post-phase forensic audit
        working-directory: tsic
        run: python scripts/forensic_audit_phase1.py
      - name: Record reference-vs-live certification scope
        if: always()
        run: |
          {
            echo "## TSIC-01 certification scope"
            echo "- Reference E2E: ${{ job.status == 'success' && 'reference_pass' || 'failed' }}"
            echo "- Deployed live integration: not_run (separate protected workflow)"
            echo "- Production readiness: unverified by this reference workflow"
            echo "- This job uses a deterministic reference Platform with fixture identities and in-memory stores."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Emit machine-readable Agent System certification manifest
        if: always()
        env:
          TSIC_REVISION: ${{ github.sha }}
          TADL_LOCK_SOURCE_REVISION: 1e6f11f0d6e4a396028c6a3475425410be2cdd71
          JOB_STATUS: ${{ job.status }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          lock = json.loads(Path("agent-developer-lock/ecosystem.lock.json").read_text())
          checkouts = {
              "developer": "agent-developer",
              "os": "agent-os",
              "platform_sdk": "agent-platform-sdk",
              "platform": "agent-platform",
          }
          repositories = {}
          for key, path in checkouts.items():
              actual = subprocess.check_output(["git", "-C", path, "rev-parse", "HEAD"], text=True).strip()
              expected = lock["repositories"][key]["ref"]
              if actual != expected:
                  raise SystemExit(f"certification evidence pin mismatch for {key}: {actual} != {expected}")
              repositories[key] = {
                  "repository": lock["repositories"][key]["repository"],
                  "expected_sha": expected,
                  "observed_sha": actual,
              }
          tsic_actual = subprocess.check_output(["git", "-C", "tsic", "rev-parse", "HEAD"], text=True).strip()
          manifest = {
              "schema": "tinlance-agent-system-certification-evidence/v1",
              "gate": "TSIC-01",
              "scope": "reference-cross-repository-e2e",
              "result": os.environ["JOB_STATUS"],
              "baseline_id": lock["baseline_id"],
              "tsic_revision": os.environ["TSIC_REVISION"],
              "tsic_checkout_revision": tsic_actual,
              "lock_source": {
                  "repository": "LloydCoder/tinlance-agent-developer",
                  "revision": os.environ["TADL_LOCK_SOURCE_REVISION"],
              },
              "integration_authority": lock["integration_authority"],
              "repositories": repositories,
              "workflow": os.environ["WORKFLOW_NAME"],
              "workflow_run_id": os.environ["WORKFLOW_RUN_ID"],
              "workflow_run_attempt": int(os.environ["WORKFLOW_RUN_ATTEMPT"]),
              "generated_at": datetime.now(timezone.utc).isoformat(),
              "live_deployment_verified": False,
              "production_readiness": "unverified",
          }
          output = Path("certification-artifacts/agent-system-e2e.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\\n", encoding="utf-8")
          print(json.dumps(manifest, sort_keys=True))
          PY
      - name: Upload immutable Agent System certification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: agent-system-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: certification-artifacts/agent-system-e2e.json
          if-no-files-found: error
          retention-days: 90
      - name: Stop reference Platform
        if: always()
        run: if test -f /tmp/tsic-platform-pid; then kill $(cat /tmp/tsic-platform-pid) || true; fi
