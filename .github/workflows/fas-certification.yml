name: FAS Certification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  fas:
    name: TSIC-30 FAS evidence certification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - run: python scripts/certify_fas.py
