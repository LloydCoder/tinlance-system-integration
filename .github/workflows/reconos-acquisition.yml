name: TSIC-03 ReconOS Contract Gate
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: tsic-03-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reconos-contract-gate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout TSIC
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate ReconOS reviewed baseline
        run: |
          python3 - <<'PY'
          import json
          import json
          b=json.load(open("policies/reconos-acquisition-baseline.json"))
          a=json.load(open("integrations/reconos/adapter.json"))
          assert b["repository"]["repository"] == "LloydCoder/reconos-ofe"
          assert len(b["repository"]["ref"]) == 40
          assert a["target_system"] == "reconos"
          assert a["authority"]["execution_authority"] == "agent-platform"
          assert "external_data_is_untrusted" in b["invariants"]
          print("PASS reviewed ReconOS baseline")
          PY
      - name: Validate ReconOS source-owned E2E requirement
        run: |
          python3 - <<'PY'
          b=json.load(open("policies/reconos-acquisition-baseline.json"))
          assert b["execution_gate"]["certifier"] == "scripts/certify_reconos_acquisition.py"
          assert b["execution_gate"]["forensic_audit"] == "scripts/forensic_audit_phase3.py"
          print("PASS ReconOS source-owned E2E gate contract")
          PY
        env:
          PYTHONPATH: .
      - name: Post-phase forensic audit
        run: python3 scripts/forensic_audit_phase3.py
