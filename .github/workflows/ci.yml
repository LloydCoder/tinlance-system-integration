name: TSIC CI
on:
  push:
    branches: [main, "phase-0/**", "integration/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate TSIC conformance
        run: python3 tooling/validate_phase0.py
      - name: Reference E2E workflow
        run: python3 tooling/run_reference_workflow.py
      - name: Recovery certification
        run: python3 tooling/recovery_cert.py
      - name: Forensic audit
        run: python3 tooling/forensic_audit.py
      - name: Security baseline
        run: python3 tooling/security_scan.py
      - name: Economic attribution certification
        run: python3 scripts/certify_economic_attribution.py
      - name: Interoperability certification
        run: python3 scripts/certify_interoperability.py
